[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendrp-connector-sdk"
version = "1.0.0"
description = "OpenDRP connector SDK — base runtime for core+connector architecture"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
]

[tool.setuptools.packages.find]
include = ["opendrp_connector*"]
