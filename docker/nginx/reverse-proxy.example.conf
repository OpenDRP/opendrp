# ------------------------------------------------------------------------------
# OpenDRP — reference TLS terminator (nginx on the host), for an internal
# installation with a self-signed certificate
# ------------------------------------------------------------------------------
# Nothing in the Compose stack terminates TLS. The UI is published as plain HTTP
# on loopback (FRONTEND_PORT, default 127.0.0.1:3000, and BACKEND_PORT on
# 127.0.0.1:8000 for the API), and this proxy is what turns it into the https://
# origin the browser uses - the same origin that belongs in CORS_ORIGINS (the
# PUBLIC URL `python setup.py` asks for).
#
# This file is an example, not a mounted configuration: it belongs on the host, in
# /etc/nginx, and the stack neither reads nor ships it. See docs/deployment.md,
# "TLS in front of the installation", for the surrounding procedure.
#
# Install (Debian/Ubuntu layout):
#   sudo cp docker/nginx/reverse-proxy.example.conf /etc/nginx/sites-available/opendrp.conf
#   sudo ln -s /etc/nginx/sites-available/opendrp.conf /etc/nginx/sites-enabled/opendrp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate:
#   * a certificate from a CA (or an internal CA that the browsers of your users
#     trust) - put its paths in ssl_certificate / ssl_certificate_key below;
#   * a self-signed one for a deployment inside the perimeter:
#
#       sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#         -keyout /etc/ssl/private/opendrp.key \
#         -out /etc/ssl/certs/opendrp.crt \
#         -subj "/CN=drp.example.com" \
#         -addext "subjectAltName=DNS:drp.example.com,IP:10.0.0.10"
#
#     Each browser shows a warning the first time and remembers the exception.
#     Leave HSTS_ENABLED=false with a certificate like this: HSTS cannot be
#     withdrawn early, and a self-signed certificate is replaced more often than
#     the window a promise would last. See .env.example, "TLS and HSTS".
#
# Why the headers below matter. The API resolves the client address itself, from
# the right-hand end of X-Forwarded-For, and it records that address in every audit
# row (`ip_address`). A proxy that does not send the header - or an installation
# whose TRUSTED_PROXY_IPS does not name the proxy - gives every audit row the
# Docker bridge address instead of the user's, which is a quiet, permanent loss of
# evidence. X-Forwarded-Proto matters for the same reason: the application has to
# know it is serving HTTPS even though the container it runs in is not.
#
# A proxy on a *different* host cannot reach the loopback bindings at all. Publish
# FRONTEND_PORT on the interface that proxy uses (for example
# `FRONTEND_PORT=10.0.0.10:3000` in .env) and add that proxy's address to
# TRUSTED_PROXY_IPS, because Compose only adds this deployment's own network.
# ------------------------------------------------------------------------------

# Plain HTTP: redirect, never serve. Two things depend on this being a redirect
# rather than a refusal: a user who typed the hostname without a scheme, and the
# Secure refresh cookie, which a browser will not send over http:// to anything
# except localhost.
server {
    listen      80;
    listen      [::]:80;
    server_name drp.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name drp.example.com;

    ssl_certificate     /etc/ssl/certs/opendrp.crt;
    ssl_certificate_key /etc/ssl/private/opendrp.key;
    # TLS 1.0/1.1 are refused rather than merely deprecated: they are removed from
    # the browsers this platform supports.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:OpenDRP:10m;
    ssl_session_timeout 1h;

    # HSTS is sent by the application itself when `HSTS_ENABLED=true` in .env, and
    # that is the recommended place to set it: both the API and the UI then answer
    # with the same value. This line is the alternative for a proxy that terminates
    # more than this installation, and it is left commented out because enabling it
    # accidentally - on a self-signed certificate, or before the certificate is in
    # place - locks browsers out of the host for the whole max-age window.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # No `server_tokens off` here: the platform's own nginx already reports a
    # generic Server header, and this proxy should not advertise nginx either.
    server_tokens off;

    # The report download can be a large PDF and the export endpoints stream, so
    # the bound is the same one the application's own nginx applies.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # `$host` rather than `$proxy_host`: the backend's CORS decision and the
        # links in a report are about the name the user typed.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Append, never replace: the client's own header value (if it sent one) is
        # on the left, and the application walks from the right, believing only
        # addresses inside TRUSTED_PROXY_IPS.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Report generation is synchronous on the request that asks for it, and
        # the default 60 s is shorter than a large inventory takes.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
    }

    # The API is reachable under /api/ through the same origin, which is what the
    # bundle is built with (VITE_API_BASE_URL=/api/v1). Nothing extra is needed
    # here: the application's own nginx proxies /api/ to the backend container.
}
