user nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        font/opentype
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom_xml
        image/jpeg
        image/gif
        image/png;

    # ---------------------------------------------------------------------------
    # The client address, and the edge rate limits built on it
    # ---------------------------------------------------------------------------
    # Which hop nginx may believe comes from TRUSTED_PROXY_IPS, rendered by
    # docker/nginx/realip.sh at container start - the same value the API uses to
    # resolve the address it records in every audit row, so the two cannot
    # disagree. When the list is empty the rendered file declares nothing and
    # `$binary_remote_addr` stays the peer address, which is the correct answer
    # for an installation reached directly. The include is a glob so that an
    # image started without its entrypoint still parses.
    include /tmp/opendrp/realip/*.inc;

    # One bucket per purpose rather than a single shared one: authentication is
    # the cheapest thing to repeat and the most expensive to get wrong, while an
    # operator watching a live scan legitimately polls. 10m holds about 160k
    # addresses per zone. The application's own limiter is per-account and fails
    # open when Redis is unreachable (docs/security.md), so these two zones are
    # what remains true when the datastore is gone.
    limit_req_zone $binary_remote_addr zone=opendrp_api:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=opendrp_auth:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=opendrp_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
