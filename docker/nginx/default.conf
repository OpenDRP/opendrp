# ------------------------------------------------------------------------------
# OpenDRP Frontend — SPA serve + /api reverse proxy to backend:8000
# ------------------------------------------------------------------------------
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    # Never expose the container's listening port in a filesystem redirect. The
    # public origin is controlled by the deployment/browser, not by this Nginx
    # worker.
    port_in_redirect off;

    # Security headers (https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers)
    # HSTS is deliberately not declared here: it is a deployment setting
    # (HSTS_ENABLED, HSTS_MAX_AGE, HSTS_INCLUDE_SUBDOMAINS in .env), rendered into
    # the include below by docker/nginx/hsts.sh so that the same three values also
    # drive what the API sends. Off by default - see .env.example.
    include /tmp/opendrp/hsts/*.inc;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Permissive-but-defensive CSP for a modern React SPA (Vite build); tighten to
    # nonce/hash if you later inline less JS/CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # --------------------------------------------------------------------------
    # API: proxy to the FastAPI backend service (docker DNS name = backend)
    # Security headers must be re-declared inside location for non-2xx/3xx too
    # --------------------------------------------------------------------------
    location /api/ {
        include /tmp/opendrp/hsts/*.inc;

        # The outer bound the API's own limiter cannot be: the application's
        # limits are per account and deliberately fail open when Redis is
        # unreachable (docs/security.md, accepted risks), while this needs no
        # backing store at all. The key is the client address after the trusted
        # -proxy resolution in nginx.conf, so a spoofed X-Forwarded-For from an
        # untrusted hop cannot buy a fresh bucket.
        limit_req zone=opendrp_api burst=60 nodelay;
        limit_conn opendrp_conn 40;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 30s;
        client_max_body_size  50M;
    }

    # --------------------------------------------------------------------------
    # Authentication: the same proxy, a much tighter bucket
    # --------------------------------------------------------------------------
    # Login, MFA verification and refresh are the endpoints an attacker repeats
    # cheaply, and this is the control that does not depend on Redis, on the
    # account lockout table, or on the application being reachable at all. A
    # prefix match selects this block over `/api/` because nginx prefers the
    # longest one. `burst=15 nodelay` lets somebody who mistyped a password try
    # again at once, while a stuffing run is answered with 429 by nginx instead
    # of by the API.
    location /api/v1/auth/ {
        include /tmp/opendrp/hsts/*.inc;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        limit_req zone=opendrp_auth burst=15 nodelay;
        limit_conn opendrp_conn 20;

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 30s;
        # Every field these endpoints accept is small: a JSON body, a form, or a
        # TOTP code. Nothing here needs the 50 MiB the rest of the API allows.
        client_max_body_size  1M;
    }

    # --------------------------------------------------------------------------
    # Celery Flower (optional, uncomment backend.flower in compose first)
    # --------------------------------------------------------------------------
    # location /flower/ {
    #     proxy_pass http://flower:5555/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # --------------------------------------------------------------------------
    # Static assets & SPA fallback
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|otf|svg|ico|png|jpe?g|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # The same include the other locations carry. This location declares its
        # own add_header, which drops the server-level ones, and a hashed asset is
        # one of the responses a browser remembers HSTS from.
        include /tmp/opendrp/hsts/*.inc;
        try_files $uri =404;
    }

    # SPA: every other route goes to index.html
    #
    # The security headers are re-declared here rather than inherited: nginx drops
    # the ones from the enclosing block as soon as a location adds its own, which is
    # the same reason /api/ repeats them.
    #
    # `no-cache` is about upgrades. index.html is the one file whose *name* does not
    # change between releases, and it is what points at the content-hashed assets, so
    # a browser holding a stale copy keeps loading a stale application. Without a
    # Cache-Control header the browser is free to treat it as fresh by heuristic and
    # not ask at all; `no-cache` still allows it to be cached, and requires it to be
    # revalidated — a conditional request that costs one 304 when nothing changed.
    location / {
        include /tmp/opendrp/hsts/*.inc;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;

        # Do not try `$uri/`: `/assets` is a real directory in the build output,
        # while it is also a client-side route. Falling through to index.html
        # keeps every application route under React Router and prevents Nginx
        # from issuing a redirect to `/assets/` on the wrong origin/port.
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
