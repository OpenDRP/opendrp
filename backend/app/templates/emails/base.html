<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDRP Alert</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #e5e7eb;
        }
        .email-wrapper {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .email-header {
            background-color: #111827;
            border-left: 4px solid #22c55e;
            padding: 20px 24px;
            border-radius: 8px 8px 0 0;
        }
        .email-header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .email-header .logo-badge {
            width: 36px;
            height: 36px;
            background-color: #22c55e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-weight: 800;
            font-size: 16px;
        }
        .email-header .logo-text {
            color: #22c55e;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .email-header .logo-sub {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 2px;
        }
        .content-block {
            background-color: #ffffff;
            color: #111827;
            padding: 28px 32px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .content-block h1,
        .content-block h2,
        .content-block h3 {
            color: #111827;
            margin-top: 0;
        }
        .content-block p {
            color: #374151;
            line-height: 1.6;
        }
        .alert-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 14px;
        }
        .alert-table th {
            background-color: #f3f4f6;
            color: #111827;
            text-align: left;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            font-weight: 600;
        }
        .alert-table td {
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            color: #374151;
            word-break: break-all;
        }
        .alert-table tr:nth-child(even) td {
            background-color: #fafafa;
        }
        .btn {
            display: inline-block;
            background-color: #22c55e;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            margin: 20px 0;
            text-align: center;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        .badge-phishing {
            display: inline-block;
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-breach {
            display: inline-block;
            background-color: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .mono {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            background-color: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #111827;
        }
        .email-footer {
            margin-top: 24px;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.6;
        }
        .email-footer a {
            color: #22c55e;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-header">
            <div class="logo">
                <div class="logo-badge">DRP</div>
                <div>
                    <div class="logo-text">OpenDRP Platform</div>
                    <div class="logo-sub">Digital Risk Protection</div>
                </div>
            </div>
        </div>
        <div class="content-block">
            {% block content %}{% endblock %}
        </div>
        <div class="email-footer">
            <p>This is an automated alert from OpenDRP Platform.<br>
            Do not reply — automated alert.</p>
        </div>
    </div>
</body>
</html>
