# ==============================================================================
# OpenDRP Backend — package metadata and tool configuration
# =============================================================================
# Dependencies deliberately do NOT live here. `requirements.txt` (runtime) and
# `requirements-dev.txt` (test/lint tooling) are the single source of truth:
# they carry the exact pins the Docker build installs and Dependabot monitors.
# An earlier copy of this file declared Poetry dependency ranges that resolved a
# different tree than the image shipped (fastapi ^0.115 pulled an old Starlette
# while requirements.txt pinned 1.6.x), so every advisory Dependabot reported
# described a package the production image never contained — and the pins that
# mattered were invisible to it.
#
# `scripts/check_dependency_sources.py` (CI job `repo-hygiene`) fails the build
# if dependency tables reappear here or if a requirements pin is not exact.
#
# The `[tool.poetry]` table is kept for `version` only: it is one of the three
# version readings `scripts/check_version_consistency.py` compares.
# ==============================================================================

[tool.poetry]
name = "opendrp-backend"
version = "0.1.2"
description = "OpenDRP — Digital Risk Protection & Brand Protection Platform Backend"
authors = ["OpenDRP Team <opendrp@localhost>"]
readme = "README.md"
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
# celery 5.x ships no py.typed marker; the import itself is not an error.
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party libs without bundled stubs (whois/python-whois, python-dateutil,
# fpdf2): silence only the *import*, not real checks.
module = [
    "whois.*",
    "dateutil.*",
    "fpdf.*",
    "qrcode.*",
]
ignore_missing_imports = true
