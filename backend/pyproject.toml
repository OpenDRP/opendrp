[tool.poetry]
name = "opendrp-backend"
version = "0.1.1"
description = "OpenDRP — Digital Risk Protection & Brand Protection Platform Backend"
authors = ["OpenDRP Team <opendrp@localhost>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.30.6,<0.54.0" }
sqlalchemy = "^2.0.35"
asyncpg = ">=0.29,<0.32"
alembic = "^1.13.2"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
PyJWT = { extras = ["crypto"], version = "^2.14.0" }
bcrypt = "^5.0.0"
python-multipart = "^0.0.32"
httpx = "^0.27.2"
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.0.8"
msgpack = "^1.2.1"
jinja2 = "^3.1.6"
fpdf2 = "^2.8.1"
mmh3 = "^4.1.0"
python-whois = "^0.9.4"
dnspython = "^2.6.1"
aiodns = "^3.2.0"
cryptography = "^50.0.1"
qrcode = "^8.2"
email-validator = "^2.2.0"
typer = ">=0.12.5,<0.28.0"
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"
structlog = "^24.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = ">=0.24,<0.27"
pytest-httpx = ">=0.31,<0.35"
ruff = ">=0.6.5,<0.17.0"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
# celery 5.x ships no py.typed marker; the import itself is not an error.
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party libs without bundled stubs (whois/python-whois, python-dateutil,
# fpdf2): silence only the *import*, not real checks.
module = [
    "whois.*",
    "dateutil.*",
    "fpdf.*",
    "qrcode.*",
]
ignore_missing_imports = true
