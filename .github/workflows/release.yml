# Release pipeline.
#
# A tag is the point where several claims have to become true at once: the code
# says one version, the images are the ones that version was built from, and an
# operator pulling `0.2.0` gets bytes somebody can audit. This workflow is what
# turns `git tag` into that, rather than into a label on a commit.
#
# It runs on `v*` tags and does six things, in order:
#
#   1. Verifies the tag against `backend/app/__init__.py`. A tag that disagrees
#      with the code would publish images whose `/api/v1/health` reports a
#      version no release note describes.
#   2. Builds every image Compose references and pushes it under one tag only:
#      `<version>-candidate`, with per-image SBOM and build provenance
#      attestations. Attestations are what let an operator check *which* workflow
#      and source revision produced an image without trusting this repository's
#      word for it.
#   3. Scans that candidate digest for known vulnerabilities and fails the
#      release on an unfixed HIGH or CRITICAL finding. Nothing a release is
#      known by exists yet, so a failed scan publishes no release.
#   4. Promotes the scanned digest to `<version>` and `latest`. A copy, not a
#      rebuild: the bytes under the release tags are the bytes the scan read,
#      attestations included.
#   5. Pulls the tags it just promoted onto a clean runner, raises the stack from
#      those images and asserts the API reports the version the tag names. Steps
#      2-4 prove what the images *are*; only this one proves they *run*.
#   6. Publishes the GitHub release with the notes taken from `CHANGELOG.md`, so
#      the curated entry — not a generated commit list — is what a user reads.
#
# Steps 2-4 are in that order because they were not. The first v0.2.1 run pushed
# `<version>` and `latest`, and only then failed on Trivy: the gate stopped the
# workflow after the publication, so the vulnerable images stayed reachable by
# `latest` until someone re-ran the release. A gate that runs after the thing it
# gates is a report, not a gate. `scripts/check_release_publish_order.py` fails
# CI if a release tag is created before the scan.
#
# Actions are pinned to commit SHAs; Dependabot updates them (see
# .github/dependabot.yml).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example, v0.2.0)
        required: true
        type: string

# Least privilege, raised only where needed: reading the source, pushing images,
# signing the attestations, and creating the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Tag matches the code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Qualified, and it has to stay qualified: `ref: v0.2.1` is ambiguous
          # when a branch of that name exists, and checkout resolves the branch.
          # The release then builds the branch while the tag-existence check
          # below still passes, because both spell the same version — that is how
          # the v0.2.1 run built images with the certifi the tag had already
          # replaced. Those branches are deleted now (v0.1.0 … v0.2.1) and
          # `scripts/check_release_branches.py` fails CI if one returns, but the
          # checkout is qualified anyway: this line must not depend on a policy
          # held somewhere else. `scripts/check_release_refs.py` fails the build
          # if any checkout in this file names a ref a branch can shadow.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fail if Compose images are missing from the release matrix
        run: |
          set -euo pipefail
          docker compose --profile '*' --env-file .env.example -f docker-compose.yml config --format json > /tmp/opendrp-compose-release.json
          python scripts/check_release_images.py /tmp/opendrp-compose-release.json
      - name: Fail if the release version disagrees with itself
        # Ten statements, not the three this step used to name: the template a new
        # installation copies, the Compose SPA fallback and the frontend image's
        # ARG default are read too (AUD-075).
        run: python scripts/check_version_consistency.py
      - id: version
        name: Fail if the tag does not name the code's version
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("backend/app/__init__.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          print(node.value.value)
          PY
          )
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid release tag: ${release_tag}"
            exit 1
          fi
          if [ "v${version}" != "${release_tag}" ]; then
            echo "::error::tag ${release_tag} does not match app/__init__.py (v${version})"
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::release tag ${release_tag} does not exist"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.image }}
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Contexts mirror docker-compose.yml exactly. An image built here from
          # a different context than the one Compose builds is how the published
          # artifact and the documented deployment drift apart.
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - image: connector-dnstwist
            context: .
            dockerfile: ./connectors/dnstwist/Dockerfile
          - image: connector-shodan
            context: .
            dockerfile: ./connectors/shodan/Dockerfile
          - image: connector-hibp
            context: .
            dockerfile: ./connectors/hibp/Dockerfile
          - image: connector-dns-security
            context: .
            dockerfile: ./connectors/dns_security/Dockerfile
          - image: connector-intelligence
            context: .
            dockerfile: ./connectors/intelligence/Dockerfile
          # One image serves both endpoint workers (`connector-exposure-netlas-endpoints`
          # and `connector-exposure-shodan-endpoints`); without it here the release
          # publishes every other image and silently not this one, and those two
          # services cannot be pulled from the tag they name.
          - image: connector-exposure-endpoints
            context: .
            dockerfile: ./connectors/exposure_endpoints/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The images are built from the tagged tree, not from a branch that
          # happens to share the tag's name.
          ref: refs/tags/${{ needs.verify-version.outputs.release_tag }}

      - name: Compute lower-case image prefix
        id: prefix
        run: echo "value=ghcr.io/$(echo '${{ github.repository_owner }}/opendrp' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The one tag this step may create. `<version>` and `latest` are not
      # pushed here — they do not exist until the scan below has passed. A push
      # is unavoidable (a digest exists only once the registry holds the image),
      # so what it guarantees is narrower than "nothing is published before the
      # scan": what it guarantees is that no tag a release is known by, and no
      # tag Compose resolves, ever names an unscanned image. A run that fails the
      # scan leaves `<version>-candidate` behind; that tag is not documented, not
      # deployed, and carries the version's name only so a maintainer can tell
      # which build it was.
      - name: Build the candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.prefix.outputs.value }}/${{ matrix.image }}:${{ needs.verify-version.outputs.version }}-candidate
          # `sbom` and `provenance` are attestations attached to the image rather
          # than files lost in a workflow artifact: whoever pulls the image can
          # ask the registry what it contains and how it was built. They are also
          # why this job does not build with `load: true` and push afterwards:
          # the docker exporter cannot carry an attestation, so that shape would
          # drop both of them silently. Promoting the scanned digest keeps them
          # and still puts nothing under a release tag before the gate.
          sbom: true
          provenance: mode=max
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_APP_VERSION=${{ needs.verify-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # The scan reads the digest, not a tag: the promotion below copies this
      # digest, so the artifact that was approved is exactly the artifact the
      # release tags point at. Scanning a tag would leave a window in which the
      # tag moves between the read and the push. `ignore-unfixed` keeps the gate
      # actionable — a release cannot fail on a finding that has no fix to apply,
      # which would only teach maintainers to bypass it.
      - name: Scan the candidate digest
        # 0.35.0 is the first immutable, post-incident Trivy Action release;
        # earlier tags were force-moved during the March 2026 compromise.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.prefix.outputs.value }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      # Two tags per image: the exact release, and `latest`. Compose defaults to
      # `latest` and pins with OPENDRP_VERSION=<release>, so both are needed —
      # but the release tag is the one to deploy, and `latest` exists only so an
      # unpinned `make up` is not a broken reference.
      #
      # `imagetools create` copies the manifest instead of rebuilding it, so this
      # costs one registry call: the layers are already there from the candidate
      # push, and the attestation manifests travel with the index. It is also the
      # reason the scan can name a digest at all — the promoted tag and the
      # scanned digest are the same bytes by construction, not by convention.
      - name: Promote the scanned digest to the release tags
        env:
          IMAGE: ${{ steps.prefix.outputs.value }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"

  # Everything above proves what the published images are: built from the tagged
  # tree, scanned, and copied to the release tags. None of it proves they start.
  # v0.2.3 was checked by hand on a workstation — `docker compose pull`, then
  # `up -d --wait`, then `/api/v1/health` answering with its own version — and
  # that check is what this job makes automatic. It is also a gate on the notes:
  # `release` waits for it, so a release is not published for images nobody has
  # seen run.
  smoke-published-images:
    name: Start the published images
    needs: [verify-version, build-and-push]
    runs-on: ubuntu-latest
    # Five containers and two datastores on a fresh runner. The manual pass this
    # replaces reached healthy in about two minutes; the bound is for the step
    # that stops returning, not for a healthy run.
    timeout-minutes: 25
    env:
      # The images the release matrix publishes, named once for the whole job: the
      # pull below and the digest guard after it read this list, so a connector
      # added to the matrix is one edit here rather than two that can drift. It is
      # the matrix that is authoritative; this is the copy the job can iterate.
      RELEASE_IMAGES: >-
        backend frontend connector-dnstwist connector-shodan connector-hibp
        connector-dns-security connector-intelligence connector-exposure-endpoints
    permissions:
      contents: read
      # The images are private: reading them back is the whole exercise, and the
      # job token can read the packages this same repository pushed.
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tag, by a ref no branch can shadow, for the same reason the build
          # job qualifies its own checkout: the smoke has to read the Compose file
          # the release was built from, not one a branch happens to carry.
          ref: refs/tags/${{ needs.verify-version.outputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Name the registry these images were pushed to
        # `github.repository_owner` keeps the owner's case, and a GHCR path is
        # lower-case, so the prefix is computed the same way the build job
        # computes it rather than assumed to be the documented default. Both
        # values go to `$GITHUB_ENV` so every later step reads them, including
        # the ones Compose runs.
        run: |
          set -euo pipefail
          prefix="ghcr.io/$(echo '${{ github.repository_owner }}/opendrp' | tr '[:upper:]' '[:lower:]')"
          echo "OPENDRP_IMAGE_PREFIX=${prefix}" >> "$GITHUB_ENV"
          # Pinned here, not only in the template: a template edit that stopped
          # pinning the version must not turn this job into a pull of `latest`,
          # which is by definition not the artifact the scan approved.
          echo "OPENDRP_VERSION=${{ needs.verify-version.outputs.version }}" >> "$GITHUB_ENV"
          echo "smoke: ${prefix} at ${{ needs.verify-version.outputs.version }}"

      - name: Write the installation's configuration
        # The wizard an operator runs, not a hand-written `.env`: a release whose
        # wizard produces a configuration the stack rejects fails here as well.
        run: python3 setup.py --non-interactive --public-url http://127.0.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull every image the release published
        # Pulled by name, not left to `docker compose pull`. Compose only pulls the
        # services of active profiles, and four of the six connectors sit behind
        # profiles (`shodan`, `hibp`, `netlas`, `netlas-endpoints`,
        # `shodan-endpoints`): with no profile enabled it fetched six images of the
        # eight the matrix publishes, silently, and the guard below then reported
        # four published images as missing. That is how this job failed on its
        # first real run, at 0.2.4. Compose still pulls afterwards for the
        # datastores the stack starts with.
        run: |
          set -euo pipefail
          for image in $RELEASE_IMAGES; do
            docker pull "${OPENDRP_IMAGE_PREFIX}/${image}:${OPENDRP_VERSION}"
          done
          docker compose pull

      - name: Refuse an image that was built instead of pulled
        # The smoke has to test the artifact and not the source tree. A locally
        # built image carries no `RepoDigest` — only a registry can supply one —
        # so this is what separates "the published image starts" from "an image
        # with the same name starts". It also catches a name that pulled
        # successfully while Compose resolved a different one.
        run: |
          set -euo pipefail
          python3 - "${{ needs.verify-version.outputs.version }}" <<'PY'
          import json, os, subprocess, sys

          version = sys.argv[1]
          prefix = os.environ["OPENDRP_IMAGE_PREFIX"]
          images = os.environ["RELEASE_IMAGES"].split()
          problems = []
          for image in images:
              reference = f"{prefix}/{image}:{version}"
              inspected = subprocess.run(
                  ["docker", "image", "inspect", reference],
                  capture_output=True,
                  text=True,
              )
              if inspected.returncode != 0:
                  problems.append(f"{reference}: not present on this runner")
                  continue
              digests = json.loads(inspected.stdout)[0].get("RepoDigests") or []
              # A `RepoDigests` entry names the repository without the tag
              # (`ghcr.io/owner/opendrp/backend@sha256:…`), so comparing it with
              # the tagged reference reports a pulled image as locally built —
              # which is how this guard first failed against a real 0.2.3 pull.
              repository = f"{prefix}/{image}@"
              if not any(digest.startswith(repository) for digest in digests):
                  problems.append(
                      f"{reference}: has no registry digest, so it was built locally "
                      "rather than pulled"
                  )
          if problems:
              sys.exit("\n".join(problems))
          print(f"smoke: {len(images)} images carry a registry digest at {version}")
          PY

      - name: Raise the stack from the published images
        # `--wait` is the assertion: every service named here has a healthcheck,
        # and Compose exits non-zero when one of them never reports healthy. The
        # connector containers are deliberately absent — a connector needs a
        # core-issued token (`docs/deployment.md` step 6) and the provider ones an
        # API key, so a fresh installation shows them restarting by design. Their
        # images are pulled and digest-checked above; what is proven here is that
        # the images an operator starts on their first run do start.
        run: >-
          docker compose up -d --wait --wait-timeout 600
          postgres redis backend celery-worker celery-worker-alerts celery-beat
          frontend

      - name: Assert the API reports the version the tag names
        # The failure this catches is a release whose images were built from a
        # tree that disagreed with its tag: `/api/v1/health` then names a version
        # no release note describes. The build job reads the file; this reads the
        # running artifact.
        run: |
          set -euo pipefail
          python3 - "${{ needs.verify-version.outputs.version }}" <<'PY'
          import json, sys, urllib.request

          expected = sys.argv[1]
          with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=30) as response:
              payload = json.load(response)
          if payload.get("version") != expected:
              sys.exit(
                  f"/api/v1/health reports {payload.get('version')!r} while the tag is "
                  f"{expected!r}"
              )
          print(f"smoke: /api/v1/health reports {expected}")
          PY

      - name: Assert readiness and the SPA answer
        # `/ready` is the deeper half of health: it names the dependencies the API
        # reached, so a stack that is up but cannot see its database or its audit
        # chain fails here instead of passing on a 200 from `/health`.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/ready", timeout=30) as response:
              ready = json.load(response)
          if ready.get("status") != "ready" or ready.get("audit_degraded"):
              sys.exit(f"/api/v1/ready is not ready: {ready}")
          unhealthy = {
              name: value
              for name, value in (ready.get("checks") or {}).items()
              if value != "ok"
          }
          if unhealthy:
              sys.exit(f"/api/v1/ready names unhealthy dependencies: {unhealthy}")

          with urllib.request.urlopen("http://127.0.0.1:3000/", timeout=30) as response:
              content_type = response.headers.get("Content-Type", "")
              body = response.read().decode("utf-8", "replace")
          if "text/html" not in content_type:
              sys.exit(f"the frontend answered {content_type!r}, not HTML")
          if '<div id="root">' not in body:
              sys.exit("the frontend answered without the SPA mount point")
          print("smoke: /api/v1/ready is ready and the frontend served the SPA")
          PY

      - name: Print the stack's logs when a step failed
        # A failed `up --wait` names the blocked service, never the reason, and a
        # runner's logs are gone when the job ends. Both halves are printed here.
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Tear the stack down
        if: always()
        run: docker compose down -v

  release:
    name: Publish the release
    # The notes wait for the smoke: a release note is a claim that these images
    # work, and the job above is the only one that reads the published artifact
    # rather than the tree it came from.
    needs: [verify-version, build-and-push, smoke-published-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release notes come from the tagged tree, not from a branch that
          # happens to share the tag's name.
          ref: refs/tags/${{ needs.verify-version.outputs.release_tag }}
      - name: Extract the notes for this version from CHANGELOG.md
        run: |
          set -euo pipefail
          python - "${{ needs.verify-version.outputs.version }}" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^##\s+\[{re.escape(version)}\].*?$(.*?)(?=^##\s+\[|\Z)", re.MULTILINE | re.DOTALL)
          match = pattern.search(text)
          if not match:
              sys.exit(f"CHANGELOG.md has no [{version}] section to publish")
          body = match.group(1).strip()
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.verify-version.outputs.release_tag }}" \
            --title "OpenDRP ${{ needs.verify-version.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --verify-tag
