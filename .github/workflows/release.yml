# Release pipeline.
#
# A tag is the point where several claims have to become true at once: the code
# says one version, the images are the ones that version was built from, and an
# operator pulling `0.2.0` gets bytes somebody can audit. This workflow is what
# turns `git tag` into that, rather than into a label on a commit.
#
# It runs on `v*` tags and does four things, in order:
#
#   1. Verifies the tag against `backend/app/__init__.py`. A tag that disagrees
#      with the code would publish images whose `/api/v1/health` reports a
#      version no release note describes.
#   2. Builds and pushes every image Compose references, with per-image SBOM and
#      build provenance attestations. Attestations are what let an operator check
#      *which* workflow and source revision produced an image without trusting
#      this repository's word for it.
#   3. Scans each pushed image for known vulnerabilities and fails the release
#      on an unfixed HIGH or CRITICAL finding. A released image is the artifact
#      customers actually run, so this is the last place the check is meaningful.
#   4. Publishes the GitHub release with the notes taken from `CHANGELOG.md`, so
#      the curated entry — not a generated commit list — is what a user reads.
#
# Actions are pinned to commit SHAs; Dependabot updates them (see
# .github/dependabot.yml).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string

# Least privilege, raised only where needed: reading the source, pushing images,
# signing the attestations, and creating the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Tag matches the code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fail if app, pyproject and CHANGELOG disagree
        run: python scripts/check_version_consistency.py
      - id: version
        name: Fail if the tag does not name the code's version
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("backend/app/__init__.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          print(node.value.value)
          PY
          )
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid release tag: ${release_tag}"
            exit 1
          fi
          if [ "v${version}" != "${release_tag}" ]; then
            echo "::error::tag ${release_tag} does not match app/__init__.py (v${version})"
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::release tag ${release_tag} does not exist"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.image }}
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Contexts mirror docker-compose.yml exactly. An image built here from
          # a different context than the one Compose builds is how the published
          # artifact and the documented deployment drift apart.
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - image: connector-dnstwist
            context: .
            dockerfile: ./connectors/dnstwist/Dockerfile
          - image: connector-shodan
            context: .
            dockerfile: ./connectors/shodan/Dockerfile
          - image: connector-hibp
            context: .
            dockerfile: ./connectors/hibp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-version.outputs.release_tag }}

      - name: Compute lower-case image prefix
        id: prefix
        run: echo "value=ghcr.io/$(echo '${{ github.repository_owner }}/opendrp' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per image: the exact release, and `latest`. Compose defaults to
      # `latest` and pins with OPENDRP_VERSION=<release>, so both are needed —
      # but the release tag is the one to deploy, and `latest` exists only so an
      # unpinned `make up` is not a broken reference.
      - name: Tags and labels
        id: meta
        run: |
          echo "tags=${{ steps.prefix.outputs.value }}/${{ matrix.image }}:${{ needs.verify-version.outputs.version }},${{ steps.prefix.outputs.value }}/${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # `sbom` and `provenance` are attestations attached to the image rather
          # than files lost in a workflow artifact: whoever pulls the image can
          # ask the registry what it contains and how it was built.
          sbom: true
          provenance: mode=max
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_APP_VERSION=${{ needs.verify-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # The scan runs against the pushed digest, not a local build: it is the
      # published artifact that an operator deploys, and `ignore-unfixed` keeps
      # the gate actionable — a release cannot fail on a finding that has no fix
      # to apply, which would only teach maintainers to bypass it.
      - name: Scan the published image
        # 0.35.0 is the first immutable, post-incident Trivy Action release;
        # earlier tags were force-moved during the March 2026 compromise.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.prefix.outputs.value }}/${{ matrix.image }}:${{ needs.verify-version.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  release:
    name: Publish the release
    needs: [verify-version, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-version.outputs.release_tag }}
      - name: Extract the notes for this version from CHANGELOG.md
        run: |
          set -euo pipefail
          python - "${{ needs.verify-version.outputs.version }}" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^##\s+\[{re.escape(version)}\].*?$(.*?)(?=^##\s+\[|\Z)", re.MULTILINE | re.DOTALL)
          match = pattern.search(text)
          if not match:
              sys.exit(f"CHANGELOG.md has no [{version}] section to publish")
          body = match.group(1).strip()
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.verify-version.outputs.release_tag }}" \
            --title "OpenDRP ${{ needs.verify-version.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --verify-tag
