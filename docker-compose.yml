  # ---------------------------------------------------------------------------
  # Netlas passive intelligence (keyed). One profile enables the three modules;
  # the provider key is NETLAS_API_TOKEN. Enable with COMPOSE_PROFILES=netlas.
  connector-phishing-netlas:
    profiles: ["netlas"]
    build:
      context: .
      dockerfile: ./connectors/intelligence/Dockerfile
    image: ${OPENDRP_IMAGE_PREFIX:-ghcr.io/opendrp/opendrp}/connector-intelligence:${OPENDRP_VERSION:-latest}
    container_name: opendrp-connector-phishing-netlas
    restart: on-failure:10
    mem_limit: 512m
    cpus: "0.75"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      CORE_URL: http://backend:8000
      CONNECTOR_NAME: phishing-netlas
      CONNECTOR_TYPE: phishing
      CONNECTOR_JOB_TYPE: phishing.netlas
      # Brand assets are what the certificate and page-text questions are asked *from*:
      # a worker that never receives them can only look for our own domain's name.
      CONNECTOR_ASSET_TYPES: domain,keyword_domain,keyword_title
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN_NETLAS_PHISHING:-}
      POLL_INTERVAL_SEC: "5"
      INTELLIGENCE_PROVIDER: netlas
      NETLAS_API_TOKEN: ${NETLAS_API_TOKEN:-}
      # An ``http.body`` search is the broadest question this worker asks, and the
      # plan entitlement is the operator's statement (F-12). Unset means refused.
      INTELLIGENCE_HTTP_BODY_ACKNOWLEDGED: ${INTELLIGENCE_HTTP_BODY_ACKNOWLEDGED:-false}
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    networks:
      - opendrp-connectors

